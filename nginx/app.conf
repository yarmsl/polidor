server {
    listen 80;
    server_name polidor.ru;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Включаем http2 для исключения веерных TCP-подключений, которые триггерят ТСПУ
    listen 443 ssl http2; 
    server_name polidor.ru;
    server_tokens off;
    client_max_body_size 100m;

    # SSL-настройки
    ssl_certificate /etc/letsencrypt/live/polidor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polidor.ru/privkey.pem;
    
    # ПРИНУДИТЕЛЬНЫЕ ПРАВКИ ДЛЯ ОБХОДА ТСПУ:
    # 1. Принудительно отключаем TLSv1.3, оставляем только стабильный TLSv1.2
    ssl_protocols TLSv1.2;
    # 2. Переопределяем параметры Certbot, чтобы его дефолтный TLS 1.3 не перекрывал нашу директиву
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # Оставляем остальные параметры certbot (но протоколы внутри options-ssl-nginx.conf теперь переопределены выше)
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip-сжатие
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types application/atom+xml application/geo+json application/javascript application/x-javascript application/json application/ld+json application/manifest+json application/rdf+xml application/rss+xml application/xhtml+xml application/xml font/eot font/otf font/ttf image/svg+xml text/css text/javascript text/plain text/xml;

    resolver 127.0.0.11;
    set $docker_host "app";
    include /etc/nginx/mime.types;

    # 1. Главный интерфейс (UI)
    location / {
        root /usr/share/nginx/html/ui;
        try_files $uri $uri/ /index.html;
    }

    # 2. Панель управления (CP)
    location /control_panel/ {
        alias /usr/share/nginx/html/cp/;
        try_files $uri $uri/ /control_panel/index.html;
    }

    # 3. Картинки и загрузки
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. API запросы к бэкенду
    location /api {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$docker_host:5000;
    }
}

# This file contains important security parameters. If you modify this file
# manually, Certbot will be unable to automatically provide future security
# updates. Instead, Certbot will print and log an error message with a path to
# the up-to-date file that you will need to refer to when manually updating
# this file.

ssl_session_cache shared:le_nginx_SSL:10m;
ssl_session_timeout 1440m;
ssl_session_tickets off;

# ПРАВКА ДЛЯ ОБХОДА ТСПУ: Оставляем только TLSv1.2 (удален TLSv1.3)
ssl_protocols TLSv1.2;

# ПРАВКА ДЛЯ ОБХОДА ТСПУ: Включаем on, чтобы сервер жестко диктовал использование TLS 1.2
ssl_prefer_server_ciphers on;

# Оптимальный набор шифров для TLS 1.2, исключающий современные шифры TLS 1.3
ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

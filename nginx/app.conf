server {
    # Включаем http2 для исключения веерных TCP-подключений, которые триггерят ТСПУ
    listen 443 ssl http2; 
    server_name polidor.ru www.polidor.ru;
    server_tokens off;
    client_max_body_size 100m;

    # SSL-сертификаты
    ssl_certificate /etc/letsencrypt/live/polidor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/polidor.ru/privkey.pem;
    
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Gzip-сжатие
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types application/atom+xml application/geo+json application/javascript application/x-javascript application/json application/ld+json application/manifest+json application/rdf+xml application/rss+xml application/xhtml+xml application/xml font/eot font/otf font/ttf image/svg+xml text/css text/javascript text/plain text/xml;

    resolver 127.0.0.11;
    set $docker_host "app";
    include /etc/nginx/mime.types;

    # 1. Главный интерфейс (UI)
    location / {
        root /usr/share/nginx/html/ui;
        try_files $uri $uri/ /index.html;
    }

    # 2. Панель управления (CP)
    location /control_panel/ {
        alias /usr/share/nginx/html/cp/;
        try_files $uri $uri/ /control_panel/index.html;
    }

    # 3. Картинки и загрузки
    location /uploads/ {
        alias /usr/share/nginx/html/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. API запросы к бэкенду
    location /api {
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://$docker_host:5000;
    }
}

server {
    listen 80;
    server_name polidor.ru www.polidor.ru;
    server_tokens off;

    # Специальный путь для проверки Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Постоянный редирект всех остальных запросов с HTTP на HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
